bookdown::gitbook:
  css: style.css
  number_sections: false
  # includes:
  #   before_body: "bookdown-demo_files/figure-latex/GURR-Full_Color.png"
  config:
    toc:
      before: |
        <li><a href="./">Gurr Lab Onboarding & Resources</a></li>
        <li class="toc-logo"><a href="./"><img src="bookdown-demo_files/figure-latex/GURR-Full_Color.png" width='150px'></a></li>
      after: |
        <li><a href="https://github.com/GurrLab/Onboarding" target="blank">Published with bookdown</a></li>
    edit: https://github.com/GurrLab/Onboarding/bookdown-demo/edit/master/%s
    download: ["pdf", "epub"]
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
bookdown::bs4_book: default
output:
  bookdown::pdf_book:
    includes:
      in_header: preamble.tex
bookdown::html_book:
  css: style.css
