bookdown::gitbook:
  css: style.css
  number_sections: false
  config:
    toc:
      before: |
        <li><a href="./">GurrLab Onboarding & Resources</a></li>
        <li class="toc-logo"><a href="./"><img src="GURR-Full_Color.png" width="150px"></a></li>
      after: |
        <li><a href="https://github.com/GurrLab/Onboarding" target="_blank">GurrLab · Oregon State University</a></li>
    edit: https://github.com/GurrLab/Onboarding/edit/main/%s
    download: ["pdf", "epub"]
    sharing:
      github: yes
      facebook: no
      twitter: no
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
